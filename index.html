h2{font-size:15px;font-weight:500;margin:20px 0 4px;color:var(--t2)}
label{display:block;font-size:14px;color:var(--t2);margin:14px 0 4px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}

.big{font-size:28px;font-weight:500;margin:6px 0 0}

.seg button.on{background:var(--tbg);color:var(--teal);font-weight:500}
.btn{width:100%;margin-top:20px;border:0;border-radius:12px;background:var(--teal);color:var(--on);font:inherit;font-weight:500;padding:13px;cursor:pointer}

.msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--red)}
.hint{font-size:13px;color:var(--t2);margin-top:14px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--pbg);color:var(--pur)}

.del{margin-left:auto;border:0;background:none;color:var(--red);font:inherit;font-size:14px;cursor:pointer}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.brow{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font-size:14px;margin:9px 0}
.trk{height:8px;border-radius:4px;background:var(--line)}.bar{height:8px;border-radius:4px;background:var(--teal)}
.rev{background:var(--pbg);color:var(--text);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:15px}
.rev .chip{margin-bottom:6px;background:none;padding:0;font-weight:500}
.empty{color:var(--t2);text-align:center;padding:28px 0}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

#tabs button svg{width:22px;height:22px;display:block}
#tabs button.on{color:var(--teal);font-weight:500;background:var(--tbg)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sc{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;cursor:pointer}
.sc.on{background:var(--tbg);color:var(--teal);border-color:var(--teal);font-weight:500}
#acct #lg{border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--t2)}
.sg{border:1px dashed var(--pur);background:var(--pbg);color:var(--pur);font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:none}
.ed,.sv,.cn{border:0;background:none;font:inherit;font-size:14px;color:var(--teal);cursor:pointer;padding:0 4px}.cn{color:var(--t2)}
.brand{display:flex;align-items:center}.brand svg{height:26px;width:auto;display:block}

.brand.big{justify-content:center;margin:6px 0 22px}.brand.big.chip{margin:6px auto 22px;width:fit-content;padding:12px 20px;border-radius:16px}.brand.big.chip svg{height:38px}.brand.big svg{height:46px}
.cbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:0 10px;border-radius:10px;cursor:pointer;white-space:nowrap}
.cmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:60vh;overflow:auto;min-width:240px;padding:4px}
.cmenu button{display:block;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.cmenu button.on{background:var(--tbg);color:var(--teal)}
.seg{position:relative}
.seg.sl .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--tbg);border-radius:9px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.seg.sl.r .thumb{transform:translateX(100%)}
.seg.sl button{position:relative;z-index:1;transition:color .25s}
.seg.sl button.on{background:none}
@media (prefers-reduced-motion:reduce){.seg.sl .thumb,.seg.sl button{transition:none}}

  for(let i=0;i<14;i++){

   const d=new Date(base.getFullYear(),base.getMonth(),1+Math.floor(r()*last));
   rows.push({type:'out',cur:'IDR',amount:Math.max(1000,Math.round(p[1]*(0.8+0.4*r())/1000)*1000),category:suggest(p[0]),note:'[contoh] '+p[0],date:ymd(d),sample:true});
  }
 }
 const res=await sbf('/rest/v1/transactions',{m:'POST',h:{Prefer:'return=representation'},b:rows.map(toRow)});
 data.push(...res.map(fromRow));
}
function agg(ks){const by={},inb={};let inc=0,out=0,miss=0,cv=0;const mc=curCode();data.forEach(d=>{if(!ks.has(d.date.slice(0,7)))return;const oc=d.cur||mc,v=conv(d.amount,oc,mc);if(v==null){miss++;return}if(oc!=mc)cv++;if(d.type=='in'){inc+=v;inb[d.category]=(inb[d.category]||0)+v}else{out+=v;by[d.category]=(by[d.category]||0)+v}});return{inc,out,by,inb,miss,cv}}
const CC={Makanan:'#E8833A',Transport:'#3A86D1',Kuliah:'#7B61C9',Tagihan:'#D4A72C',Belanja:'#D9568A',Hiburan:'#2AA6A0',Kesehatan:'#D64B4B',Lainnya:'#8A9099',Gaji:'#2F9E5E','Uang jajan':'#4FA3E0',Freelance:'#E39A2E',Hadiah:'#D85FA0','Uang saku':'#4FA3E0',Kerja:'#2F9E5E'};
const col=c=>CC[c]||'#8A9099';
function pieSvg(ent,tot){
 const o="<svg viewBox='0 0 200 200' style='display:block;width:100%;max-width:220px;margin:8px auto' role='img' aria-label='"+t('v_pie')+"'>";
 if(ent.length==1)return o+`<circle cx='100' cy='100' r='90' fill='${col(ent[0][0])}'/></svg>`;
 let a=-Math.PI/2,h=o;
 for(const [c,v] of ent){const b=a+v/tot*2*Math.PI,x1=100+90*Math.cos(a),y1=100+90*Math.sin(a),x2=100+90*Math.cos(b),y2=100+90*Math.sin(b);
  h+=`<path d='M100 100L${x1.toFixed(2)} ${y1.toFixed(2)}A90 90 0 ${b-a>Math.PI?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z' fill='${col(c)}' style='stroke:var(--card);stroke-width:2'/>`;a=b}
 return h+'</svg>'}
function sect(by,pby,kind,pl){
 const ent=Object.entries(by).sort((x,z)=>z[1]-x[1]),tot=ent.reduce((q,x)=>q+x[1],0);
 if(!ent.length)return `<p class='empty'>${t(kind=='in'?'noinc':'noexp')}</p>`;
 let h=sview=='pie'
  ?pieSvg(ent,tot)+ent.map(([c,v])=>`<div class='brow' style='grid-template-columns:14px 1fr auto'><i class='dot' style='background:${col(c)}'></i><span>${catL(c)} · ${Math.round(v/tot*100)}%</span><span>${rp(v)}</span></div>`).join('')
  :ent.map(([c,v])=>`<div class='brow' style='grid-template-columns:112px 1fr auto'><span><i class='dot' style='background:${col(c)}'></i>${catL(c)}</span><div class='trk'><div class='bar' style='width:${Math.round(v/ent[0][1]*100)}%;background:${col(c)}'></div></div><span>${rp(v)}</span></div>`).join('');
 const nm=[...new Set([...Object.keys(by),...Object.keys(pby)])];
 if(Object.keys(pby).length)h+=`<div class='sub' style='margin-top:12px'>${t('vs',{m:pl})}</div>`+nm.map(c=>{const d=(by[c]||0)-(pby[c]||0);return `<div class='brow' style='grid-template-columns:1fr auto'><span><i class='dot' style='background:${col(c)}'></i>${catL(c)}</span><span style='color:var(--t2)'>${d==0?t('same'):(d>0?t('up')+' ':t('dn')+' ')+rp(Math.abs(d))}</span></div>`}).join('');
 return h}
function curPicker(){return `<button id='cb' class='cbtn' aria-label='${t('s_cur')}' aria-haspopup='listbox'>${cur().s} ▾</button><div id='cm' class='cmenu' role='listbox' hidden>${Object.keys(CUR).sort().map(k=>`<button data-c='${k}' role='option' class='${k==curCode()?'on':''}'><b>${CUR[k].s}</b> · ${k} · ${cname(k)}</button>`).join('')}</div>`}
function bindPicker(){$('#cb').onclick=()=>{$('#cm').hidden=!$('#cm').hidden};document.querySelectorAll('#cm button').forEach(b=>b.onclick=()=>setMain(b.dataset.c))}
function viewSum(){
 const ms=[...new Set(data.map(d=>d.date.slice(0,7)))].sort().reverse();
 if(!ms.length){$('#app').innerHTML=`<h1>${t('sum_h')}</h1><div style='display:flex;justify-content:flex-end;position:relative'>${curPicker()}</div><p class='empty'>${t('sum0')}</p>`;bindPicker();return}
 const all=per=='all',n=all?0:+per,idx=k=>{const [y,m]=k.split('-').map(Number);return y*12+m-1};
 const mk=i=>Math.floor(i/12)+'-'+pad(i%12+1),mn=i=>new Date(2000,i%12,1).toLocaleDateString(loc(),{month:'long'});
 const lbl=x=>n==1?new Date(Math.floor(x/12),x%12,1).toLocaleDateString(loc(),{month:'long',year:'numeric'}):n==3?'Q'+(x%12/3+1)+' '+Math.floor(x/12)+' · '+mn(x)+' – '+mn(x+2):n==6?mn(x)+' – '+mn(x+5)+' '+Math.floor(x/12):String(Math.floor(x/12));
 const starts=all?[]:[...new Set(ms.map(k=>Math.floor(idx(k)/n)*n))].sort((x,z)=>z-x);
 if(!all&&!starts.includes(psel))psel=starts[0];
 const rng=all?ms:Array.from({length:n},(_,i)=>mk(psel+i)),prv=all?[]:Array.from({length:n},(_,i)=>mk(psel-n+i));
 const a=agg(new Set(rng)),p=agg(new Set(prv)),cats=Object.entries(a.by).sort((x,z)=>z[1]-x[1]),bal=a.inc-a.out;
 let rev='';
 if(cats.length){const top=cats[0],low=cats[cats.length-1];rev=t(n==1?'rev1':'revp1',{o:rp(a.out),i:rp(a.inc),t:catL(top[0]),tv:rp(top[1]),l:catL(low[0]),lv:rp(low[1])});
  if(p.out)rev+=t(n==1?'rev2':'revp2',{d:a.out>=p.out?t('up'):t('dn'),x:rp(Math.abs(a.out-p.out))})}
 $('#app').innerHTML=`<h1>${t('sum_h')}</h1>
 <div style='display:flex;gap:8px;position:relative'><select id='per' style='flex:1;min-width:0' aria-label='${t('period')}'>${[['1','per_1'],['3','per_3'],['6','per_6'],['12','per_12'],['all','per_all']].map(([v,k])=>`<option value='${v}'${v==per?' selected':''}>${t(k)}</option>`).join('')}</select>${all?'':`<select id='mo' style='flex:1;min-width:0' aria-label='${t('per_'+per)}'>${starts.map(x=>`<option value='${x}'${x==psel?' selected':''}>${lbl(x)}</option>`).join('')}</select>`}${curPicker()}</div>
 <div class='seg' id='vseg' style='margin-top:12px'><button data-v='bars' class='${sview=='bars'?'on':''}'>${t('v_list')}</button><button data-v='pie' class='${sview=='pie'?'on':''}'>${t('v_pie')}</button></div>
 <div class='met' style='margin-top:12px'><div><small>${t('minc')}</small><b>${rp(a.inc)}</b></div><div><small>${t('mout')}</small><b>${rp(a.out)}</b></div><div><small>${t('bal')}</small><b>${bal<0?'−':''}${rp(Math.abs(bal))}</b></div></div>
 ${a.miss?`<p class='msg'>${t('norate')}</p>`:((a.cv||p.cv)&&RATES?`<p class='hint'>${t('ratenote',{s:RATES.s,d:new Date(RATES.d+'T00:00:00').toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'})})}</p>`:'')}<h2>${t('bycat_in')}</h2>${sect(a.inb,p.inb,'in',all?'':lbl(psel-n))}
 <h2>${t('bycat')}</h2>${sect(a.by,p.by,'out',all?'':lbl(psel-n))}`+
 (rev?`<div class='rev'><span class='chip'>${t('chipr')}</span><br>${rev}</div>`:'');
 bindPicker();
 $('#per').onchange=e=>{per=e.target.value;psel=null;sv('ft_per',per);viewSum()};
 if(!all)$('#mo').onchange=e=>{psel=+e.target.value;viewSum()};
 document.querySelectorAll('#vseg button').forEach(b=>b.onclick=()=>{sview=b.dataset.v;sv('ft_sview',sview);viewSum()});
}
(async()=>{if(sess&&SB_OK){try{await fresh();if(sess)await loadAll()}catch(e){}}render()})();
</script>
